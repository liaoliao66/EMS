<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>保养通知详情 · 弹窗 · EMS v1.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../assets/common.css" />
</head>
<body class="modal-page">
  <div id="root" class="modal-page-panel">
    <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-5 py-3">
      <div>
        <div class="text-sm font-semibold text-slate-900">保养通知详情</div>
        <div class="text-xs text-slate-500">弹窗 · 灯箱样式 · 不含审批/消息/权限</div>
      </div>
      <button type="button" class="lightbox-close static" onclick="closeModalOrBack('保养管理_保养通知_page.html')" aria-label="关闭">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="flex-1 overflow-auto px-5 py-4">
    <div class="pb-2">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><div><label class="mb-1 block text-xs text-slate-500">通知编号</label><input class="input" value="BN-20260805-01" disabled /></div><div><label class="mb-1 block text-xs text-slate-500">通知日期</label><input class="input" value="2026-08-05" disabled /></div><div><label class="mb-1 block text-xs text-slate-500">运营设备</label><input class="input" value="OP-2026-001 / 1号门吊" disabled /></div><div><label class="mb-1 block text-xs text-slate-500">维保负责人</label><input class="input" value="王工" disabled /></div><div><label class="mb-1 block text-xs text-slate-500">下次保养日期</label><input class="input" value="2026-08-10" disabled /></div></div>
      <p class="mt-4 text-xs text-slate-400">只读业务汇总。</p>
      <div class="mt-6 flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button type="button" class="btn-ghost px-4 py-2 text-sm" onclick="closeModalOrBack('保养管理_保养通知_page.html')">取消</button>
        <button type="button" class="btn-brand px-4 py-2 text-sm" onclick="saveAndClose('保养管理_保养通知_page.html')">保存 / 提交</button>
      </div>
    </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="../assets/common.js"></script>
  <script>
    (function(){
      const embed = new URLSearchParams(location.search).get('embed') === '1';
      if(!embed){
        document.body.classList.add('standalone-lightbox');
        const root = document.getElementById('root');
        root.classList.add('standalone-panel');
        root.classList.remove('modal-page-panel');
      }
    })();
    
  </script>
</body>
</html>
