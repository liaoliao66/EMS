<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>新增 / 编辑点巡检标准 · 弹窗 · EMS v1.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../assets/common.css" />
</head>
<body class="modal-page">
  <div id="root" class="modal-page-panel">
    <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-5 py-3">
      <div>
        <div class="text-sm font-semibold text-slate-900">新增 / 编辑点巡检标准</div>
        <div class="text-xs text-slate-500">弹窗 · 灯箱样式 · 不含审批/消息/权限</div>
      </div>
      <button type="button" class="lightbox-close static" onclick="closeModalOrBack('基础配置_点巡检标准_page.html')" aria-label="关闭">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="flex-1 overflow-auto px-5 py-4">
    <div class="pb-2">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><div><label class="mb-1 block text-xs text-slate-500">标准编码</label><input class="input" maxlength="4" placeholder="4位编码，唯一" /></div><div><label class="mb-1 block text-xs text-slate-500">标准名称</label><input class="input" /></div><div><label class="mb-1 block text-xs text-slate-500">启用</label><select class="select"><option>启用</option><option>禁用</option></select></div><div><label class="mb-1 block text-xs text-slate-500">检查说明</label><textarea class="textarea" rows="3"></textarea></div></div>
      <p class="mt-4 text-xs text-slate-400">填写完成后保存；提交后由平台审批承接。</p>
      <div class="mt-6 flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button type="button" class="btn-ghost px-4 py-2 text-sm" onclick="closeModalOrBack('基础配置_点巡检标准_page.html')">取消</button>
        <button type="button" class="btn-brand px-4 py-2 text-sm" onclick="saveAndClose('基础配置_点巡检标准_page.html')">保存 / 提交</button>
      </div>
    </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="../assets/common.js"></script>
  <script>
    (function(){
      const embed = new URLSearchParams(location.search).get('embed') === '1';
      if(!embed){
        document.body.classList.add('standalone-lightbox');
        const root = document.getElementById('root');
        root.classList.add('standalone-panel');
        root.classList.remove('modal-page-panel');
      }
    })();
    
  </script>
</body>
</html>
