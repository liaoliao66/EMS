<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>新增点巡检记录（异常） · 弹窗 · EMS v1.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../assets/common.css" />
</head>
<body class="modal-page">
  <div id="root" class="modal-page-panel">
    <div class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white px-5 py-3">
      <div>
        <div class="text-sm font-semibold text-slate-900">新增点巡检记录（异常）</div>
        <div class="text-xs text-slate-500">弹窗 · 灯箱样式 · 不含审批/消息/权限</div>
      </div>
      <button type="button" class="lightbox-close static" onclick="closeModalOrBack('点巡检_点巡检记录_page.html')" aria-label="关闭">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="flex-1 overflow-auto px-5 py-4">
    <div class="pb-2">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2"><div><label class="mb-1 block text-xs text-slate-500">点巡检区域</label><button type="button" class="btn-ghost block w-full px-3 py-2 text-left text-sm" onclick="openLightbox('通用_选择点巡检区域.html')">选择已启用区域</button></div><div><label class="mb-1 block text-xs text-slate-500">维修建议</label><select class="select"><option>立即维修</option><option>计划维修</option><option>继续观察</option></select></div><div><label class="mb-1 block text-xs text-slate-500">巡检负责人</label><input class="input" value="当前用户" /></div><div><label class="mb-1 block text-xs text-slate-500">现场照片</label><input class="input" type="file" multiple accept="image/png,image/jpeg" /></div><div class="md:col-span-2 rounded-2xl bg-amber-50 px-4 py-3 text-sm text-amber-800">任一项非正常即为异常；异常必须上传现场照片，否则 Toast 拦截。</div></div>
      <p class="mt-4 text-xs text-slate-400">填写完成后保存；提交后由平台审批承接。</p>
      <div class="mt-6 flex justify-end gap-2 border-t border-slate-100 pt-4">
        <button type="button" class="btn-ghost px-4 py-2 text-sm" onclick="closeModalOrBack('点巡检_点巡检记录_page.html')">取消</button>
        <button type="button" class="btn-brand px-4 py-2 text-sm" onclick="saveAndClose('点巡检_点巡检记录_page.html')">保存 / 提交</button>
      </div>
    </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="../assets/common.js"></script>
  <script>
    (function(){
      const embed = new URLSearchParams(location.search).get('embed') === '1';
      if(!embed){
        document.body.classList.add('standalone-lightbox');
        const root = document.getElementById('root');
        root.classList.add('standalone-panel');
        root.classList.remove('modal-page-panel');
      }
    })();
    
  </script>
</body>
</html>
